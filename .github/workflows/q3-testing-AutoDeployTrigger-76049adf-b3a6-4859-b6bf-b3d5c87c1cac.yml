name: Trigger auto deployment for q3-testing

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/q3-testing-AutoDeployTrigger-76049adf-b3a6-4859-b6bf-b3d5c87c1cac.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.Q3TESTING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.Q3TESTING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.Q3TESTING_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.Q3TESTING_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.Q3TESTING_REGISTRY_PASSWORD }}
          containerAppName: q3-testing
          resourceGroup: NetworkWatcherRG
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


